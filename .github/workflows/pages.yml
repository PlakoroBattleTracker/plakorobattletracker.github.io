name: Publish Plakoro Battle Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Reuse verified original card images
        uses: actions/cache@v4
        with:
          path: .card-cache
          key: card-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: card-images-${{ runner.os }}-
      - name: Assemble and verify all card images
        run: python3 build-site.py
      - name: Fetch and verify the latest PlakoroDB and Chronicle cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node refresh-site-cards.cjs
      - name: Validate website update behavior
        run: node check-published-updates.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
